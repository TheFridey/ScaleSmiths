name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          if npm run test -- --help 2>&1 | grep -q -- "--runInBand"; then
            npm run test -- --runInBand
          else
            npm run test
          fi

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Public site Playwright
        run: npm run test:e2e:chromium

      - name: Public performance budgets
        run: npm run check:performance-budgets

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-artifacts
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-performance-reports
          path: web/performance-reports
          if-no-files-found: ignore

  admin:
    name: Admin
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          if npm pkg get scripts.lint | grep -qv '^{}$'; then
            npm run lint
          else
            echo "Skipping admin lint: no lint script."
          fi

      - name: Test
        run: |
          if npm pkg get scripts.test | grep -qv '^{}$'; then
            npm run test
          else
            echo "Skipping admin tests: no test script."
          fi

      - name: Forge benchmark suite
        run: npm run test:forge-benchmark

      - name: Build
        run: npm run build

      - name: Upload Forge benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-benchmark-report
          path: admin/benchmark-results/forge
          if-no-files-found: ignore

  root-hygiene:
    name: Root Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "Skipping root npm ci: no package-lock.json."
          fi

      - name: Check env hygiene
        run: npm run check:env-hygiene

      - name: Check architecture documentation
        run: npm run check:architecture-docs

      - name: Simulate canary release and rollback
        run: npm run test:release-simulation
