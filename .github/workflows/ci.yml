name: CI

on:
  push:
    branches: [master, release/forge-v2-rc]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use supported npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Public performance budgets
        run: npm run check:performance-budgets

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Chromium journeys and visual regression
        run: npm run test:e2e:chromium

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-playwright-artifacts
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-performance-reports
          path: web/performance-reports
          if-no-files-found: ignore
          retention-days: 14

  cross-browser-smoke:
    name: Cross-browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use supported npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit

      - name: Firefox and WebKit functional smoke
        run: npm run test:e2e:cross-browser

      - name: Upload cross-browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-browser-playwright-artifacts
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  admin:
    name: Admin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Use supported npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Forge benchmark suite
        run: npm run test:forge-benchmark

      - name: Production build
        run: npm run build

      - name: Upload Forge benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-benchmark-report
          path: admin/benchmark-results/forge
          if-no-files-found: ignore
          retention-days: 14

  database:
    name: Database and Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scalesmiths_integration_test
          POSTGRES_USER: scalesmiths_ci
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scalesmiths_ci -d scalesmiths_integration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://scalesmiths_ci:local_ci_only@127.0.0.1:5432/scalesmiths_integration_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Use supported npm
        run: npm install --global npm@10.9.2

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify web and admin migration journals
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          npm run test:migration-consistency 2>&1 | tee ci-artifacts/migration-policy-tests.log
          node scripts/check-migrations.mjs 2>&1 | tee ci-artifacts/migration-consistency.log
          npm run check:migration-history 2>&1 | tee ci-artifacts/migration-history-integrity.log
          npm run test:migration-history 2>&1 | tee ci-artifacts/migration-history-tests.log

      - name: Run real PostgreSQL integration suite
        working-directory: admin
        run: |
          mkdir -p ../ci-artifacts
          set -o pipefail
          npm run test:integration 2>&1 | tee ../ci-artifacts/postgresql-integration.log

      - name: Upload migration and integration logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: database-migration-logs
          path: ci-artifacts
          if-no-files-found: error
          retention-days: 14

  backup-recovery:
    name: Backup and Restore
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scalesmiths_backup_source_test
          POSTGRES_USER: scalesmiths_backup_test
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scalesmiths_backup_test -d scalesmiths_backup_source_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: local_ci_only
      TEST_SOURCE_DATABASE_URL: postgresql://scalesmiths_backup_test:local_ci_only@127.0.0.1:5432/scalesmiths_backup_source_test
      TEST_RESTORE_DATABASE_URL: postgresql://scalesmiths_backup_test:local_ci_only@127.0.0.1:5432/scalesmiths_restore_drill_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Use supported npm
        run: npm install --global npm@10.9.2

      - name: Install recovery test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client-16 jq gnupg shellcheck

      - name: Create isolated restore database
        run: createdb --host=127.0.0.1 --username=scalesmiths_backup_test scalesmiths_restore_drill_test

      - name: Shell safety analysis
        run: shellcheck -x scripts/backup/*.sh

      - name: Disposable backup and restore drill
        env:
          CI_ARTIFACTS_DIR: ${{ github.workspace }}/ci-artifacts
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          npm run test:backup-framework 2>&1 | tee ci-artifacts/backup-framework.log

      - name: Upload backup framework diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backup-framework-test-log
          path: ci-artifacts
          if-no-files-found: error
          retention-days: 14

  root-hygiene:
    name: Root Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Use supported npm
        run: npm install --global npm@10.9.2

      - name: Check env hygiene
        run: npm run check:env-hygiene

      - name: Check architecture documentation
        run: npm run check:architecture-docs

      - name: Check dependency governance
        run: npm run check:dependency-governance

      - name: Test dependency governance rules
        run: npm run test:dependency-governance

      - name: Check production topology consistency
        run: npm run check:production-topology

      - name: Test production topology consistency rules
        run: npm run test:production-topology

      - name: Test backup migration verifier safeguards
        run: npm run test:backup-migration-safety

      - name: Check GitHub Actions policy
        run: npm run check:github-actions

      - name: Test GitHub Actions policy
        run: npm run test:github-actions

      - name: Simulate canary release and rollback
        run: npm run test:release-simulation

  nginx:
    name: Nginx Topology
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Use supported npm
        run: npm install --global npm@10.9.2

      - name: Validate production Nginx config syntax
        run: npm run test:nginx-config

      - name: Host-Nginx topology integration tests
        run: npm run test:nginx

  forge-e2e:
    name: Forge Workflow E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Use supported npm
        run: npm install --global npm@10.9.2

      # Admin migrations reference web-owned tables, so the web history is applied
      # first by scripts/run-forge-e2e-tests.mjs and web dependencies are required.
      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Full Forge workflow end-to-end suite
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          npm run test:forge-e2e 2>&1 | tee ci-artifacts/forge-workflow-e2e.log

      - name: Upload Forge E2E log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-e2e-logs
          path: ci-artifacts/forge-workflow-e2e.log
          if-no-files-found: error
          retention-days: 14
