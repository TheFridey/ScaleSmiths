name: CodeQL

on:
  push:
    branches: [master, release/forge-v2-rc]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Fork PRs have read-only tokens. CodeQL uploads for trusted branches,
    # pushes and schedules; the remaining CI/security gates still run on forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@051e2f90686233507fe9283ff167d2e709304b30 # v3.36.0
        with:
          languages: javascript-typescript
          queries: security-extended
      # JavaScript/TypeScript extraction does not require a synthetic root build;
      # web and admin production builds are separate required CI jobs.
      - name: Analyze
        uses: github/codeql-action/analyze@051e2f90686233507fe9283ff167d2e709304b30 # v3.36.0
        with:
          category: /language:javascript-typescript
