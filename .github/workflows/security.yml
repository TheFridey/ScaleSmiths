name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  secrets:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for verified secrets
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          extra_args: --results=verified --fail

  npm-audit:
    name: npm Audit (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Audit production dependencies and retain report
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high --json | tee npm-audit-${{ matrix.app }}.json
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.app }}
          path: ${{ matrix.app }}/npm-audit-${{ matrix.app }}.json
          if-no-files-found: error
          retention-days: 14

  dockerfile-lint:
    name: Hadolint (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint application Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.app }}/Dockerfile
          failure-threshold: error

  images:
    name: Image Security (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build application image without runtime secrets
        id: build
        run: docker build --tag scalesmiths-${{ matrix.app }}:security ./${{ matrix.app }}
      - name: Scan high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scalesmiths-${{ matrix.app }}:security
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate application-image SPDX SBOM
        if: always() && steps.build.outcome == 'success'
        uses: anchore/sbom-action@v0.17.9
        with:
          image: scalesmiths-${{ matrix.app }}:security
          format: spdx-json
          output-file: sbom-${{ matrix.app }}.spdx.json
      - name: Upload container scan and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-${{ matrix.app }}
          path: |
            trivy-${{ matrix.app }}.sarif
            sbom-${{ matrix.app }}.spdx.json
          if-no-files-found: error
          retention-days: 30

  sandbox-security:
    name: Generated-site Sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install admin dependencies
        working-directory: admin
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run generated-site sandbox security fixtures
        working-directory: admin
        run: npm run test -- src/lib/forge-sandbox-security.test.ts
