name: Security

on:
  push:
    branches: [master, release/forge-v2-rc]
  pull_request:
    branches: [master]
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify GitHub Dependency Graph is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error --output /tmp/dependency-sbom.json --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom")"
          if [ "$status" != "200" ]; then
            echo "::error::Dependency Review could not run (GitHub API HTTP ${status}). Enable Dependency Graph in Settings > Security > Advanced Security, then rerun this workflow."
            exit 1
          fi
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  secrets:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository history for verified secrets
        uses: trufflesecurity/trufflehog@466da5b0bb161144f6afca9afe5d57975828c410 # v3.90.8
        with:
          extra_args: --results=verified

  npm-audit:
    name: npm Audit (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Use supported npm
        run: npm install --global npm@10.9.2
      - name: Audit production dependencies and retain report
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high --json | tee npm-audit-${{ matrix.app }}.json
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit-${{ matrix.app }}
          path: ${{ matrix.app }}/npm-audit-${{ matrix.app }}.json
          if-no-files-found: error
          retention-days: 14

  dockerfile-lint:
    name: Hadolint (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint application Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.app }}/Dockerfile
          failure-threshold: error

  images:
    name: Image Security (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build application image without runtime secrets
        id: build
        run: docker build --tag scalesmiths-${{ matrix.app }}:security ./${{ matrix.app }}
      - name: Scan high and critical image vulnerabilities
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scalesmiths-${{ matrix.app }}:security
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate application-image SPDX SBOM
        if: always() && steps.build.outcome == 'success'
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          image: scalesmiths-${{ matrix.app }}:security
          format: spdx-json
          output-file: sbom-${{ matrix.app }}.spdx.json
      - name: Upload container scan and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-security-${{ matrix.app }}
          path: |
            trivy-${{ matrix.app }}.sarif
            sbom-${{ matrix.app }}.spdx.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce HIGH and CRITICAL image vulnerability threshold
        if: always() && steps.build.outcome == 'success' && steps.trivy.outcome == 'failure'
        run: |
          echo "::error::Trivy found a HIGH or CRITICAL image vulnerability. SARIF and SBOM evidence were uploaded above."
          exit 1

  sandbox-security:
    name: Generated-site Sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Use supported npm
        run: npm install --global npm@10.9.2
      - name: Install admin dependencies
        working-directory: admin
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run generated-site sandbox security fixtures
        working-directory: admin
        run: npm run test -- src/lib/forge-sandbox-security.test.ts
