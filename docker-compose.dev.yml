services:
  web:
    image: ss-web-dev
    build:
      context: .
      dockerfile: web/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: development
    volumes:
      - ./domain:/workspace/domain:ro
      - ./web/src:/workspace/web/src
      - ./web/public:/workspace/web/public
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"
    networks: [ss-dev]

  admin:
    image: ss-admin-dev
    build:
      context: .
      dockerfile: admin/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      NODE_ENV: development
      FORGE_SANDBOX_RUNNER: local
    volumes:
      - ./domain:/workspace/domain:ro
      - ./scripts:/workspace/scripts:ro
      - ./admin/src:/workspace/admin/src
      - ./admin/public:/workspace/admin/public
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"
    networks: [ss-dev]

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"
    networks: [ss-dev]

volumes:
  postgres-dev-data:

networks:
  ss-dev:
    driver: bridge
