services:
  web:
    image: ss-web-dev
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: development
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ss-dev]

  admin:
    image: ss-admin-dev
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      NODE_ENV: development
      FORGE_SANDBOX_RUNNER: local
    volumes:
      - ./admin/src:/app/src
      - ./admin/public:/app/public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ss-dev]

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ss-dev]

volumes:
  postgres-dev-data:

networks:
  ss-dev:
    driver: bridge
