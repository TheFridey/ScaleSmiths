services:
  postgres-integration:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scalesmiths_integration_test
      POSTGRES_USER: scalesmiths_test
      POSTGRES_PASSWORD: scalesmiths_test_only
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalesmiths_test -d scalesmiths_integration_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
