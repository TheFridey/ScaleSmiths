services:
  web:
    image: ss-web-prod
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      NODE_ENV: production
      WEB_DATABASE_URL: ${WEB_DATABASE_URL:?WEB_DATABASE_URL is required in production}
      ADMIN_DATABASE_URL: ""
      MIGRATION_DATABASE_URL: ""
      POSTGRES_PROVISIONING_DATABASE_URL: ""
      READONLY_DATABASE_URL: ""
      BACKUP_DATABASE_URL: ""
      DATABASE_URL: ""
      SENTRY_AUTH_TOKEN: ""
      LOG_SHIPPING_TOKEN: ""
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health | grep -qF '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [ss-net]

  admin:
    image: ss-admin-prod
    build:
      context: ./admin
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      NODE_ENV: production
      WEB_DATABASE_URL: ""
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:?ADMIN_DATABASE_URL is required in production}
      MIGRATION_DATABASE_URL: ""
      POSTGRES_PROVISIONING_DATABASE_URL: ""
      READONLY_DATABASE_URL: ""
      BACKUP_DATABASE_URL: ""
      DATABASE_URL: ""
      SENTRY_AUTH_TOKEN: ""
      LOG_SHIPPING_TOKEN: ""
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --header=\"x-health-check-token: $$ADMIN_HEALTH_CHECK_TOKEN\" http://127.0.0.1:3001/api/health | grep -qF '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    volumes:
      - ./generated-sites:/app/generated-sites
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [ss-net]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      WEB_DATABASE_URL: ""
      ADMIN_DATABASE_URL: ""
      MIGRATION_DATABASE_URL: ""
      POSTGRES_PROVISIONING_DATABASE_URL: ""
      READONLY_DATABASE_URL: ""
      BACKUP_DATABASE_URL: ""
      DATABASE_URL: ""
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [ss-net]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [ss-net]

volumes:
  postgres-data:

networks:
  ss-net:
    driver: bridge
