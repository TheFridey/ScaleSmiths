services:
  web:
    image: ss-web-prod
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      WEB_DATABASE_URL: ${WEB_DATABASE_URL:?WEB_DATABASE_URL is required in production}
      ADMIN_DATABASE_URL: ""
      MIGRATION_DATABASE_URL: ""
      DATABASE_URL: ""
      SENTRY_AUTH_TOKEN: ""
      LOG_SHIPPING_TOKEN: ""
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ss-net]

  admin:
    image: ss-admin-prod
    build:
      context: ./admin
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      WEB_DATABASE_URL: ""
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:?ADMIN_DATABASE_URL is required in production}
      MIGRATION_DATABASE_URL: ""
      DATABASE_URL: ""
      SENTRY_AUTH_TOKEN: ""
      LOG_SHIPPING_TOKEN: ""
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./generated-sites:/app/generated-sites
    networks: [ss-net]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      WEB_DATABASE_URL: ""
      ADMIN_DATABASE_URL: ""
      MIGRATION_DATABASE_URL: ""
      POSTGRES_PROVISIONING_DATABASE_URL: ""
      READONLY_DATABASE_URL: ""
      BACKUP_DATABASE_URL: ""
      DATABASE_URL: ""
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ss-net]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [web, admin]
    networks: [ss-net]

volumes:
  postgres-data:

networks:
  ss-net:
    driver: bridge
