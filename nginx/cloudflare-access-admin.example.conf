# Reviewed admin-only replacement for the admin server blocks in
# host-scalesmiths.conf. Generate both includes with:
#   node scripts/update-cloudflare-nginx-ranges.mjs /etc/nginx/snippets
# Do not apply this configuration to scalesmiths.co.uk.

geo $realip_remote_addr $cloudflare_origin_peer {
  default 0;
  include /etc/nginx/snippets/cloudflare-origin-peers.conf;
}

server {
  listen 80;
  listen [::]:80;
  server_name admin.scalesmiths.co.uk;
  include /etc/nginx/snippets/cloudflare-real-ip.conf;
  if ($cloudflare_origin_peer = 0) { return 444; }
  return 301 https://admin.scalesmiths.co.uk$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin.scalesmiths.co.uk;

  ssl_certificate /etc/letsencrypt/live/admin.scalesmiths.co.uk/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.scalesmiths.co.uk/privkey.pem;
  include /etc/nginx/snippets/cloudflare-real-ip.conf;
  if ($cloudflare_origin_peer = 0) { return 444; }

  # Optional Authenticated Origin Pulls (prefer a per-hostname certificate).
  # ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
  # ssl_verify_client on;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;

  # Health checks go directly to 127.0.0.1:3101 with X-Health-Check-Token.
  location = /api/health { return 404; }

  location / {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    # real_ip accepts CF-Connecting-IP only after the socket peer matched a
    # generated Cloudflare range. Overwrite, never append, forwarding headers.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_cache_bypass $http_upgrade;
  }
}
