# Optional host-level Nginx example for exposing Forge at forge.scalesmiths.co.uk.
# This should proxy to the same private admin container as admin.scalesmiths.co.uk.
# Do not enable this file until DNS and the Let's Encrypt certificate exist.
#
# Existing host-Nginx deployment expects the admin container on:
#   http://127.0.0.1:3101
#
# Recommended default: keep Forge at https://admin.scalesmiths.co.uk/forge.
# Use this subdomain only if you want a separate hostname for the same admin app.

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80;
  listen [::]:80;
  server_name forge.scalesmiths.co.uk;

  return 301 https://forge.scalesmiths.co.uk$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name forge.scalesmiths.co.uk;

  ssl_certificate /etc/letsencrypt/live/forge.scalesmiths.co.uk/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/forge.scalesmiths.co.uk/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;

  # Optional private access layer. Replace with trusted IPs before uncommenting.
  # allow YOUR.PUBLIC.IP.ADDRESS;
  # deny all;

  # Optional Cloudflare-only origin lock. Keep this commented unless the hostname
  # is orange-clouded and Cloudflare IP ranges are maintained by automation.
  # include /etc/nginx/cloudflare-allowlist.conf;
  # deny all;

  location / {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
