# Temporary first-run host Nginx config before Let's Encrypt certificates exist.
# Install this first, run certbot, then replace it with host-scalesmiths.conf.

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

include /etc/nginx/scalesmiths/upstreams.conf;

server {
  listen 80;
  listen [::]:80;
  server_name scalesmiths.co.uk www.scalesmiths.co.uk;

  location / {
    proxy_pass http://scalesmiths_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name admin.scalesmiths.co.uk;

  location / {
    proxy_pass http://scalesmiths_admin;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
