# Final host-level Nginx config for a VPS that already serves other sites.
# Install as /etc/nginx/sites-available/scalesmiths and symlink it into sites-enabled.
# Use host-scalesmiths-http.conf first if the Let's Encrypt certificates do not exist yet.
#
# This expects the app containers to be started with:
#   docker compose -f docker-compose.host-nginx.yml up --build -d
#
# The proxy/header/hardening directives below are shared with the disposable test
# harness in tests/nginx so production behaviour and its tests cannot drift. Install
# the snippets alongside the upstreams include:
#   install -d /etc/nginx/scalesmiths/snippets
#   cp nginx/snippets/*.conf /etc/nginx/scalesmiths/snippets/
# Validate with `nginx -t` before every `systemctl reload nginx` (see
# docs/operations/nginx-testing.md).
#
# This config intentionally defines no global `default_server`: the VPS hosts other
# sites and must not swallow their unknown-host traffic. Exact server_name matching
# is what keeps unknown hosts off the ScaleSmiths apps, and the test harness proves
# it with a catch-all that returns 444.

include /etc/nginx/scalesmiths/snippets/connection-upgrade-map.conf;

# Managed by scripts/release-manager.mjs. Install the initial example from
# nginx/scalesmiths-upstreams.conf before testing this host configuration.
include /etc/nginx/scalesmiths/upstreams.conf;

server {
  listen 80;
  listen [::]:80;
  server_name scalesmiths.co.uk www.scalesmiths.co.uk;

  return 301 https://scalesmiths.co.uk$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name scalesmiths.co.uk www.scalesmiths.co.uk;

  ssl_certificate /etc/letsencrypt/live/scalesmiths.co.uk/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/scalesmiths.co.uk/privkey.pem;

  include /etc/nginx/scalesmiths/snippets/security-headers.conf;
  include /etc/nginx/scalesmiths/snippets/body-size.conf;
  include /etc/nginx/scalesmiths/snippets/hardening-locations.conf;

  location / {
    include /etc/nginx/scalesmiths/snippets/proxy-public.conf;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name admin.scalesmiths.co.uk;

  return 301 https://admin.scalesmiths.co.uk$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin.scalesmiths.co.uk;

  ssl_certificate /etc/letsencrypt/live/admin.scalesmiths.co.uk/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.scalesmiths.co.uk/privkey.pem;

  include /etc/nginx/scalesmiths/snippets/security-headers.conf;
  include /etc/nginx/scalesmiths/snippets/body-size.conf;

  # For mandatory Cloudflare Access, replace these admin server blocks with
  # cloudflare-access-admin.example.conf. The public server above is unchanged.

  location / {
    include /etc/nginx/scalesmiths/snippets/proxy-admin.conf;
  }
}
