events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

  # ── scalesmiths.io (public site) ─────────────────────────
  server {
    listen 80;
    server_name scalesmiths.io www.scalesmiths.io;
    return 301 https://scalesmiths.io$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name scalesmiths.io www.scalesmiths.io;

    ssl_certificate     /etc/letsencrypt/live/scalesmiths.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scalesmiths.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    location / {
      proxy_pass         http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # ── admin.scalesmiths.io (admin panel) ───────────────────
  server {
    listen 80;
    server_name admin.scalesmiths.io;
    return 301 https://admin.scalesmiths.io$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name admin.scalesmiths.io;

    ssl_certificate     /etc/letsencrypt/live/admin.scalesmiths.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.scalesmiths.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Admin IP restriction:
    # 1. From the network that should access the admin panel, run:
    #      curl ifconfig.me
    # 2. Replace YOUR.CURRENT.IP.HERE below with that IP address.
    # 3. Uncomment both directives to allow only that IP and block everyone else.
    #
    # allow YOUR.CURRENT.IP.HERE;
    # deny all;

    location / {
      proxy_pass         http://admin:3001;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
