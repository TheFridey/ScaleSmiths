# Shared hardening for the public-facing server block. server context.
#
#   * Generated marketing sites live under ./generated-sites on the host and are
#     mounted into the admin container only. They must never be served from the
#     public origin, so any /generated-sites path is refused here regardless of
#     what the upstream app would do.
#   * Upstream failures return a controlled maintenance page (carrying the
#     X-ScaleSmiths-Error marker) instead of leaking a raw upstream error.
location ^~ /generated-sites {
  return 404;
}

error_page 502 503 504 /__scalesmiths_upstream_error.html;

location = /__scalesmiths_upstream_error.html {
  internal;
  default_type text/html;
  add_header X-ScaleSmiths-Error "upstream" always;
  return 502 "<!doctype html><meta charset=\"utf-8\"><title>ScaleSmiths is temporarily unavailable</title><p>The service is temporarily unavailable. Please try again shortly.</p>";
}
