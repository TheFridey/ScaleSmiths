# Shared reverse-proxy directives for the admin application. location context.
# The `scalesmiths_admin` upstream is defined per environment. This is a direct
# origin sitting behind an edge, so the client-supplied forwarding chain is NOT
# trusted: X-Forwarded-For is overwritten with the immediate peer instead of
# being appended to.
proxy_pass http://scalesmiths_admin;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Do not preserve a client-supplied forwarding chain at a direct origin.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_cache_bypass $http_upgrade;
