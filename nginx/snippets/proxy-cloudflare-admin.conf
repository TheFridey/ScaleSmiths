# Shared reverse-proxy directives for the admin app behind Cloudflare. location
# context. Used by the reviewed nginx/cloudflare-access-admin.example.conf and by
# the test harness so the Cloudflare trust behaviour is exercised, not just
# documented. real_ip must have already rewritten $remote_addr to the true client
# (only when the socket peer was a verified Cloudflare origin), so every
# forwarding header is overwritten from $remote_addr — a client-supplied value is
# never trusted here.
proxy_pass http://scalesmiths_admin;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header CF-Connecting-IP $remote_addr;
proxy_cache_bypass $http_upgrade;
