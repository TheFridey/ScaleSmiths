# Shared reverse-proxy directives for the public web application. location
# context. The `scalesmiths_web` upstream is defined per environment: production
# installs nginx/scalesmiths-upstreams.conf; the harness installs its own test
# upstreams pointing at the mock service. As a public-facing origin this appends
# to the X-Forwarded-For chain rather than overwriting it.
proxy_pass http://scalesmiths_web;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_cache_bypass $http_upgrade;
