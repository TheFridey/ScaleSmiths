# Shared reverse-proxy directives for the public web application. location
# context. The `scalesmiths_web` upstream is defined per environment: production
# installs nginx/scalesmiths-upstreams.conf; the harness installs its own test
# upstreams pointing at the mock service.
#
# scalesmiths.co.uk is a DIRECT origin — it is not proxied through Cloudflare
# (see docs/operations/cloudflare-access.md), so $remote_addr is the real client
# and there is no upstream forwarding chain worth preserving.
#
# This previously used $proxy_add_x_forwarded_for, which APPENDS to whatever the
# client sent. A visitor could therefore send `X-Forwarded-For: 1.2.3.4` and the
# application — which read the leftmost entry — would bucket every request under
# an address of the attacker's choosing, defeating the quote and portal-login
# rate limits entirely. The header is now overwritten from the verified peer.
proxy_pass http://scalesmiths_web;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Do not preserve a client-supplied forwarding chain at a direct origin.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_cache_bypass $http_upgrade;
