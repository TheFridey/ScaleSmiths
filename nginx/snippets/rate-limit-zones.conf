# Shared rate-limiting zones. http context — include this alongside the
# upstreams include, never inside a server block.
#
# This is the volumetric layer. It exists to absorb brute-force and flood traffic
# before it reaches Node, and is deliberately far more permissive than the
# semantic limits the applications enforce in PostgreSQL. A request that passes
# here is still subject to the per-account and per-identity limits described in
# docs/operations/rate-limiting-and-abuse-controls.md.
#
# The public origin (scalesmiths.co.uk) is NOT proxied through Cloudflare, so
# these zones are the only edge protection it has. $binary_remote_addr is the
# real TCP peer and cannot be forged by a client.
#
# Keying note: buckets are per exact address, not per IPv6 /64. Nginx cannot
# truncate an IPv6 address to its /64 without a regex over $remote_addr, and
# every such regex either misses nginx's compressed renderings or silently
# over-aggregates a whole ISP allocation into one bucket — which would lock out
# uninvolved customers. /64 aggregation is therefore done in the application
# layer (web/src/lib/client-ip.ts), where the address can be parsed properly.

limit_req_status 429;
limit_conn_status 429;

# Interactive authentication: admin sign-in, portal sign-in. Tight, because a
# human signs in a handful of times a day and the application limit is 5 per 10
# minutes per identity.
limit_req_zone $binary_remote_addr zone=ss_auth:10m rate=20r/m;

# Public lead capture. The application allows 3 submissions per 10 minutes per
# address and per email; this stops a flood from ever reaching that check, and
# with it the two Resend emails each accepted submission sends.
limit_req_zone $binary_remote_addr zone=ss_quote:10m rate=12r/m;

# Everything else under /api/. Generous: a single page view can legitimately
# fire several analytics and portal calls.
limit_req_zone $binary_remote_addr zone=ss_api:10m rate=300r/m;

# Concurrency guard. Bounds slow-loris style connection hoarding independently of
# request rate.
limit_conn_zone $binary_remote_addr zone=ss_conn:10m;
