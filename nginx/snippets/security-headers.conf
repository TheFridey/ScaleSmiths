# Shared response security headers. server context. Included by both the public
# and admin server blocks in production and in the test harness so the two never
# drift. `always` keeps the headers on error responses (e.g. the 502 page).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
