# Simulated trusted Cloudflare edge. It sits at a fixed address inside the CIDR
# the harness Nginx trusts and injects CF-Connecting-IP the way Cloudflare does,
# then forwards to the admin-cf host. Because its socket peer is the trusted
# address, the harness Nginx honours the CF-Connecting-IP it sets — proving the
# trusted path. (The untrusted path is the tester hitting Nginx directly.)
server {
  listen 80;
  server_name _;

  location / {
    proxy_pass http://nginx:80;
    proxy_set_header Host admin-cf.scalesmiths.co.uk;
    # The real visitor IP a genuine Cloudflare edge would report.
    proxy_set_header CF-Connecting-IP 203.0.113.7;
  }
}
