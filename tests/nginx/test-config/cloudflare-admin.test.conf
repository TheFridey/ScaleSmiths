# Test rendering of the Cloudflare-Access admin hardening
# (nginx/cloudflare-access-admin.example.conf). It proves the trust logic: only a
# request whose real socket peer is a verified Cloudflare origin may set the
# client IP via CF-Connecting-IP; arbitrary origins cannot spoof it.
#
# In production the trusted peer set is generated from Cloudflare's published
# ranges by scripts/update-cloudflare-nginx-ranges.mjs. Here the single trusted
# origin is the harness "edge" container at its fixed compose-network address.
# The proxy header block is the SAME shared snippet the example uses.

# http context. $realip_remote_addr is the ORIGINAL socket peer, evaluated before
# real_ip rewriting, so an untrusted client cannot flip this to 1.
geo $realip_remote_addr $cloudflare_origin_peer {
  default 0;
  172.31.240.30/32 1;
}

server {
  listen 80;
  server_name admin-cf.scalesmiths.co.uk;

  # Trust CF-Connecting-IP only from the verified edge; from anyone else the
  # header is ignored and $remote_addr stays the untrusted caller.
  set_real_ip_from 172.31.240.30/32;
  real_ip_header CF-Connecting-IP;

  include /etc/nginx/scalesmiths/snippets/security-headers.conf;
  include /etc/nginx/scalesmiths/snippets/body-size.conf;

  # Any origin that is not a verified Cloudflare peer is dropped.
  if ($cloudflare_origin_peer = 0) {
    return 444;
  }

  location / {
    include /etc/nginx/scalesmiths/snippets/proxy-cloudflare-admin.conf;
  }
}
