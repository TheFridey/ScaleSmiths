# Disposable test rendering of nginx/host-scalesmiths.conf.
#
# It is deliberately derived from the SAME shared snippets in nginx/snippets so
# the production routing/header/hardening behaviour is what actually gets tested.
# Only the environment-specific edges differ from production:
#   * self-signed certificates instead of Let's Encrypt (no real certs in CI)
#   * upstreams resolve to mock containers instead of loopback ports
#   * a harness-only default_server catch-all proves unknown hosts are rejected
#     (production omits this so it stays a polite neighbour on a shared VPS)
#
# Loaded at http context via the stock image's `include /etc/nginx/conf.d/*.conf`.

include /etc/nginx/scalesmiths/snippets/connection-upgrade-map.conf;
include /etc/nginx/scalesmiths/snippets/rate-limit-zones.conf;
include /etc/nginx/scalesmiths/upstreams.conf;

# Test-only dead upstream: a closed port so requests fail and exercise the shared
# error-page snippet (proves controlled 5xx handling, not a raw upstream error).
upstream scalesmiths_down {
  server 127.0.0.1:1;
}

# ── Harness-only catch-all ──────────────────────────────────────────────
# Any request whose Host does not exactly match a ScaleSmiths server_name is
# dropped with 444. Production does NOT define this; the harness owns the whole
# Nginx instance so it can assert that our exact server_name matching never
# leaks unknown hosts onto the apps.
server {
  listen 80 default_server;
  listen 443 ssl default_server;
  server_name _;

  ssl_certificate /etc/nginx/certs/test.crt;
  ssl_certificate_key /etc/nginx/certs/test.key;

  return 444;
}

# ── scalesmiths.co.uk / www (public web app) ────────────────────────────
server {
  listen 80;
  server_name scalesmiths.co.uk www.scalesmiths.co.uk;

  return 301 https://scalesmiths.co.uk$request_uri;
}

server {
  listen 443 ssl;
  server_name scalesmiths.co.uk www.scalesmiths.co.uk;

  ssl_certificate /etc/nginx/certs/test.crt;
  ssl_certificate_key /etc/nginx/certs/test.key;

  include /etc/nginx/scalesmiths/snippets/security-headers.conf;
  include /etc/nginx/scalesmiths/snippets/body-size.conf;
  include /etc/nginx/scalesmiths/snippets/hardening-locations.conf;

  limit_conn ss_conn 40;

  location = /portal/api/login {
    limit_req zone=ss_auth burst=10 nodelay;
    add_header Retry-After 60 always;
    include /etc/nginx/scalesmiths/snippets/proxy-public.conf;
  }

  location = /api/quote {
    limit_req zone=ss_quote burst=5 nodelay;
    add_header Retry-After 60 always;
    include /etc/nginx/scalesmiths/snippets/proxy-public.conf;
  }

  location ^~ /api/ {
    limit_req zone=ss_api burst=100 nodelay;
    add_header Retry-After 60 always;
    include /etc/nginx/scalesmiths/snippets/proxy-public.conf;
  }

  location ^~ /portal/api/ {
    limit_req zone=ss_api burst=100 nodelay;
    add_header Retry-After 60 always;
    include /etc/nginx/scalesmiths/snippets/proxy-public.conf;
  }

  location / {
    include /etc/nginx/scalesmiths/snippets/proxy-public.conf;
  }
}

# ── admin.scalesmiths.co.uk (admin app) ─────────────────────────────────
server {
  listen 80;
  server_name admin.scalesmiths.co.uk;

  return 301 https://admin.scalesmiths.co.uk$request_uri;
}

server {
  listen 443 ssl;
  server_name admin.scalesmiths.co.uk;

  ssl_certificate /etc/nginx/certs/test.crt;
  ssl_certificate_key /etc/nginx/certs/test.key;

  include /etc/nginx/scalesmiths/snippets/security-headers.conf;
  include /etc/nginx/scalesmiths/snippets/body-size.conf;

  limit_conn ss_conn 40;

  location ^~ /api/auth/ {
    limit_req zone=ss_auth burst=20 nodelay;
    add_header Retry-After 60 always;
    include /etc/nginx/scalesmiths/snippets/proxy-admin.conf;
  }

  location ^~ /api/ {
    limit_req zone=ss_api burst=100 nodelay;
    add_header Retry-After 60 always;
    include /etc/nginx/scalesmiths/snippets/proxy-admin.conf;
  }

  location / {
    include /etc/nginx/scalesmiths/snippets/proxy-admin.conf;
  }
}

# ── down.scalesmiths.co.uk (test-only upstream-failure host) ─────────────
# Uses the same shared hardening snippet as the public block so the controlled
# error page is what actually gets asserted.
server {
  listen 443 ssl;
  server_name down.scalesmiths.co.uk;

  ssl_certificate /etc/nginx/certs/test.crt;
  ssl_certificate_key /etc/nginx/certs/test.key;

  include /etc/nginx/scalesmiths/snippets/security-headers.conf;
  include /etc/nginx/scalesmiths/snippets/body-size.conf;
  include /etc/nginx/scalesmiths/snippets/hardening-locations.conf;

  location / {
    proxy_pass http://scalesmiths_down;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
