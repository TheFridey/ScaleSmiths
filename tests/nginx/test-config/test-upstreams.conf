# Test-only upstreams. Installed to the same path production uses
# (/etc/nginx/scalesmiths/upstreams.conf) so the test config's include line is
# identical to nginx/host-scalesmiths.conf. Points at the disposable mock
# services instead of the loopback blue/green ports.
upstream scalesmiths_web {
  server web-mock:80;
}

upstream scalesmiths_admin {
  server admin-mock:80;
}
